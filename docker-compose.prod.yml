services:
  redis:
    ports: !reset []
    restart: always

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: riyura_app_prod
    image: riyura-backend:latest
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD:-}@redis:6379}
      - LOKI_ENABLED=${LOKI_ENABLED:-false}
      - LOKI_URL=${LOKI_URL:-http://loki:3100/loki/api/v1/push}
    volumes: !reset []
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 10s
      start_period: 90s
      retries: 3
    sysctls: !reset {}
