<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Watch Party Testing - dev</title>
    <style>
      :root {
        --glass-bg: rgba(255, 255, 255, 0.03);
        --glass-border: rgba(255, 255, 255, 0.08);
        --glass-blur: blur(40px);
        --accent: #ffffff;
        --text-primary: rgba(255, 255, 255, 0.95);
        --text-secondary: rgba(255, 255, 255, 0.55);
        --radius-lg: 24px;
        --radius-md: 16px;
        --radius-sm: 10px;
        --font:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter",
          sans-serif;
      }

      body {
        margin: 0;
        padding: 24px;
        height: 100vh;
        box-sizing: border-box;
        background: #000;
        background-image:
          radial-gradient(
            circle at 20% 30%,
            rgba(124, 106, 247, 0.15) 0%,
            transparent 40%
          ),
          radial-gradient(
            circle at 80% 70%,
            rgba(94, 234, 212, 0.1) 0%,
            transparent 40%
          );
        color: var(--text-primary);
        font-family: var(--font);
        display: flex;
        gap: 24px;
        overflow: hidden;
      }
      * {
        box-sizing: border-box;
      }

      /* Utilities */
      .glass {
        background: var(--glass-bg);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1px solid var(--glass-border);
        border-radius: var(--radius-lg);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      }

      .panel {
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
      }
      .panel-left {
        flex: 0 0 320px;
      }
      .panel-mid {
        flex: 1;
      }
      .panel-right {
        flex: 0 0 340px;
      }

      .header {
        padding: 20px 24px;
        font-weight: 500;
        font-size: 15px;
        letter-spacing: 0.5px;
        border-bottom: 1px solid var(--glass-border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .content {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .content::-webkit-scrollbar {
        width: 4px;
      }
      .content::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 4px;
      }

      .section {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--glass-border);
        border-radius: var(--radius-md);
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .section-title {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      label {
        font-size: 12px;
        color: var(--text-secondary);
        margin-bottom: 4px;
        display: block;
      }
      input,
      select {
        width: 100%;
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--text-primary);
        padding: 10px 14px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        outline: none;
        transition: all 0.2s;
      }
      input:focus,
      select:focus {
        border-color: rgba(255, 255, 255, 0.3);
        background: rgba(0, 0, 0, 0.3);
      }

      button {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--text-primary);
        padding: 10px 16px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      button:active {
        transform: scale(0.98);
      }
      button.primary {
        background: var(--text-primary);
        color: #000;
        font-weight: 600;
      }
      button.primary:hover {
        background: rgba(255, 255, 255, 0.8);
      }
      button.danger {
        background: rgba(248, 113, 113, 0.15);
        color: #fca5a5;
        border-color: rgba(248, 113, 113, 0.2);
      }
      button.danger:hover {
        background: rgba(248, 113, 113, 0.25);
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .badge {
        background: rgba(255, 255, 255, 0.1);
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 11px;
        font-family: monospace;
        letter-spacing: 1px;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
      }
      .status-dot.on {
        background: #4ade80;
        box-shadow: 0 0 8px #4ade80;
      }

      /* Chat */
      .chat-msg {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--glass-border);
        border-radius: var(--radius-md);
        padding: 12px;
      }
      .chat-msg.mine {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.2);
      }
      .chat-meta {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--text-secondary);
        margin-bottom: 6px;
      }
      .chat-sender {
        font-weight: 600;
        color: var(--text-primary);
      }
      .chat-body {
        font-size: 13px;
        line-height: 1.4;
      }

      /* Event Log */
      .event-item {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--glass-border);
        border-radius: var(--radius-md);
        padding: 12px;
        font-size: 12px;
        margin-bottom: 12px;
        animation: fadeIn 0.3s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .event-badge {
        display: inline-block;
        padding: 3px 8px;
        border-radius: 12px;
        font-size: 10px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .event-payload {
        font-family: monospace;
        color: var(--text-secondary);
        white-space: pre-wrap;
        font-size: 11px;
      }

      .placeholder {
        text-align: center;
        color: var(--text-secondary);
        font-size: 12px;
        margin: auto;
      }

      /* Chat panel needs a fixed input bar at the bottom */
      .chat-panel {
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
      }
      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .chat-messages::-webkit-scrollbar {
        width: 4px;
      }
      .chat-messages::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 4px;
      }
      .chat-input-bar {
        padding: 16px;
        border-top: 1px solid var(--glass-border);
        display: flex;
        gap: 12px;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <!-- Controls Panel -->
    <div class="panel panel-left glass">
      <div class="header">
        Controls
        <div id="sseStatus" class="status-dot"></div>
      </div>
      <div class="content">
        <div class="section">
          <label>Auth Token (JWT)</label>
          <input
            type="password"
            id="token"
            placeholder="Paste Supabase JWT..."
          />
          <button onclick="parseToken()">Parse Token</button>
          <div
            id="tokenStatus"
            style="font-size: 11px; color: var(--text-secondary)"
          >
            No token parsed
          </div>
        </div>

        <div class="section">
          <label>Join Party</label>
          <div style="display: flex; gap: 8px">
            <input
              type="text"
              id="joinCode"
              placeholder="8-char code"
              maxlength="8"
              style="text-transform: uppercase; font-family: monospace"
            />
            <button class="primary" onclick="joinParty()">Join</button>
          </div>
        </div>

        <div class="section">
          <div class="section-title">Create Party</div>
          <div class="row">
            <div>
              <label>Type</label
              ><select id="createMediaType">
                <option value="Movie">Movie</option>
                <option value="TV">TV</option>
              </select>
            </div>
            <div>
              <label>TMDB ID</label
              ><input type="number" id="createTmdbId" value="550" />
            </div>
          </div>
          <label>Provider</label>
          <input type="text" id="createProviderId" value="vidsrc" />
          <div class="row" id="tvFields" style="display: none">
            <div>
              <label>Season</label
              ><input type="number" id="createSeason" value="1" />
            </div>
            <div>
              <label>Episode</label
              ><input type="number" id="createEpisode" value="1" />
            </div>
          </div>
          <button class="primary" onclick="createParty()">Create</button>
        </div>

        <div class="section" id="activeParty" style="display: none">
          <div
            class="section-title"
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
            "
          >
            <div>
              Active Party <span class="badge" id="partyCodeDisplay"></span>
              <button
                class="primary"
                style="padding: 2px 6px; font-size: 11px; margin-left: 6px"
                onclick="copyShareLink()"
              >
                Share
              </button>
            </div>
          </div>
          <div
            style="
              font-size: 12px;
              color: var(--text-secondary);
              display: flex;
              flex-direction: column;
              gap: 6px;
              margin-top: 8px;
            "
          >
            <div style="display: flex; justify-content: space-between">
              <span>Host</span>
              <span id="infoHost" style="color: var(--text-primary)"></span>
            </div>
            <div style="display: flex; justify-content: space-between">
              <span>Progress</span>
              <span id="infoProgress" style="color: var(--text-primary)"></span>
            </div>
          </div>

          <div
            id="hostControls"
            style="
              display: none;
              flex-direction: column;
              gap: 8px;
              margin-top: 12px;
            "
          >
            <label>Push Progress (host)</label>
            <div style="display: flex; gap: 8px">
              <input type="number" id="hostProgress" value="0" />
              <button onclick="pushProgress()">Push</button>
            </div>
          </div>

          <div style="display: flex; gap: 8px; margin-top: 12px">
            <button style="flex: 1" onclick="doSync()">Sync</button>
            <button style="flex: 1" onclick="sendHeartbeat()">Ping</button>
          </div>
          <button class="danger" onclick="leaveParty()">Leave Party</button>
        </div>
      </div>
    </div>

    <!-- Chat Panel -->
    <div class="panel-mid glass chat-panel">
      <div class="header">Chat</div>
      <div class="chat-messages" id="chatArea">
        <div class="placeholder">Join a party to start chatting</div>
      </div>
      <div class="chat-input-bar">
        <input
          type="text"
          id="chatInput"
          placeholder="Message..."
          onkeydown="if (event.key === 'Enter') sendChat();"
        />
        <button class="primary" onclick="sendChat()">Send</button>
      </div>
    </div>

    <!-- Events Panel -->
    <div class="panel panel-right glass">
      <div class="header">
        Events
        <button
          style="padding: 4px 10px; font-size: 11px"
          onclick="document.getElementById('eventsPanel').innerHTML = ''"
        >
          Clear
        </button>
      </div>
      <div class="content" id="eventsPanel" style="gap: 0">
        <div class="placeholder">No events yet</div>
      </div>
    </div>

    <script src="/party-test.js"></script>
  </body>
</html>
