spring:
  application:
    name: Riyura
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: dev

  threads:
    virtual:
      enabled: true

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 15
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mvc:
    contentnegotiation:
      default-content-type: application/json

tmdb:
  api-key: ${TMDB_API_KEY}
  base-url: ${TMDB_API_BASE_URL}
  image-base-url: ${TMDB_IMAGE_BASE_URL}

supabase:
  jwt-secret: ${SUPABASE_JWT_SECRET}
  issuer-uri: ${SUPABASE_ISSUER_URI:https://placeholder.supabase.co/auth/v1}
riyura:
  security:
    encryption-key: ${ENCRYPTION_KEY}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    groups-order: ASC
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

loki:
  enabled: ${LOKI_ENABLED:false}
  url: ${LOKI_URL:http://localhost:3100/loki/api/v1/push}

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024
  tomcat:
    max-connections: 8192
    accept-count: 100
    connection-timeout: 60000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: Riyura
    distribution:
      percentiles-histogram:
        http.server.requests: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
    instances:
      tmdb:
        baseConfig: default

---
spring:
  config:
    activate:
      on-profile: dev

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

---
spring:
  config:
    activate:
      on-profile: prod
    import: ""

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
