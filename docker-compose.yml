services:
  redis:
    image: redis:7-alpine
    container_name: riyura_redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: riyura-backend:dev
    container_name: riyura_app_dev
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD:-}@redis:6379}
      - SPRING_DEVTOOLS_RESTART_POLL_INTERVAL=1000ms
      - SPRING_DEVTOOLS_RESTART_QUIET_PERIOD=400ms
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./pom.xml:/app/pom.xml
      - maven_cache:/root/.m2
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      backend:
      frontend:
        aliases:
          - riyura-api

networks:
  backend:
    name: riyura-backend_default
  frontend:
    name: riyura-frontend_default
    external: true

volumes:
  redis_data:
  maven_cache:
